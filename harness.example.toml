# Copy to harness.toml or pass --config.
# Paths in workspace.roots are the only repositories the app will open.

[server]
host = "127.0.0.1"
port = 7465

[workspace]
roots = ["examples/sample-repo"]
# Seconds allowed for the project's tests, both for verification and for a
# shell command the agent runs. A timeout is a failed check, not a hung run.
# check_timeout = 300
# Verdict command for repositories that are not pytest projects. Split with
# shlex, no shell. Defaults to "python -m pytest -q".
# check_command = "npm test"

[provider]
# Serve uses a live model when Ollama is running or OPENAI_API_KEY / XAI_API_KEY
# is set. Pin GPT-5.6 Luna with HARNESS_PROVIDER=openai and OPENAI_API_KEY.
# "deterministic" is for `harness demo` and tests only.
# name = "openai_compat"

[data]
dir = ".harness"
