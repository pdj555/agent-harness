[project]
name = "agent-harness"
version = "0.1.0"
description = "Run frontier coding agents unattended. Nothing lands unless your tests pass and a second model approves."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-harness contributors" }]
keywords = ["agent", "coding-agent", "harness", "verification"]
dependencies = [
  "claude-agent-sdk>=0.2.165",
  "fastapi>=0.115",
  "openai-codex>=0.162.1",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
harness = "harness.__main__:main"

[project.urls]
Homepage = "https://github.com/pdj555/agent-harness"
Documentation = "https://github.com/pdj555/agent-harness/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
"examples/sample-repo/README.md" = "harness/sample-repo/README.md"
"examples/sample-repo/test_tracker.py" = "harness/sample-repo/test_tracker.py"
"examples/sample-repo/tracker.py" = "harness/sample-repo/tracker.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["harness", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
