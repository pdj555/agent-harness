[project]
name = "agent-harness"
version = "0.1.0"
description = "A local coding agent that can't mark its own work done. Isolated worktree, tests decide, explicit apply."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Preston Jones" }]
keywords = ["agent", "coding-agent", "harness", "verification", "llm", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.17.0",
]

[project.scripts]
harness = "harness.__main__:main"

[project.urls]
Homepage = "https://github.com/pdj555/agent-harness"
Documentation = "https://github.com/pdj555/agent-harness/tree/main/docs"
Issues = "https://github.com/pdj555/agent-harness/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
"examples/sample-repo/README.md" = "harness/sample-repo/README.md"
"examples/sample-repo/test_tracker.py" = "harness/sample-repo/test_tracker.py"
"examples/sample-repo/tracker.py" = "harness/sample-repo/tracker.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["harness", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
