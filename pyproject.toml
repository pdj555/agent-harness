[project]
name = "agent-harness-oss"
version = "0.1.0"
description = "A local coding-agent harness: one objective, isolated changes, evidence-gated results."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-harness-oss contributors" }]
keywords = ["agent", "coding-agent", "harness", "verification"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
harness = "harness.__main__:main"

[project.urls]
Homepage = "https://github.com/pdj555/agent-harness-oss"
Documentation = "https://github.com/pdj555/agent-harness-oss/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["harness", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
