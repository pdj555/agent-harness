name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check harness tests scripts
      - name: Tests
        run: uv run pytest
      - name: Secret scan
        run: uv run python scripts/scan_secrets.py
      - name: Dependency audit
        run: uvx pip-audit
      - name: Build
        run: uv build
      - name: Built wheel secret scan
        run: uv run python scripts/scan_secrets.py dist/*.whl
      - name: Installed demo
        run: uv run python scripts/smoke_wheel.py dist/*.whl
