name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check harness tests scripts
      - name: Tests
        run: uv run pytest
      - name: Secret scan
        run: uv run python scripts/scan_secrets.py

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Sync
        run: uv sync --extra dev --locked
      - name: Dependency audit
        run: uvx pip-audit
      - name: Build
        run: uv build
      - name: Built wheel secret scan
        run: uv run python scripts/scan_secrets.py dist/*.whl
      - name: Demo from the installed wheel
        run: uv run python scripts/smoke_wheel.py dist/*.whl
