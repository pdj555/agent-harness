<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="A change travels from the agent, through the tests, to the gate. A sabotaged change stops at the gate. An honest change lands on main."><title>A change travels from the agent, through the tests, to the gate. A sabotaged change stops at the gate. An honest change lands on main.</title>
