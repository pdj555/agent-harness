<rect x="592" y="72" width="288" height="64" rx="12" fill="#21262d" stroke="#f0f6fc" stroke-width="1.6"/>
<text x="736" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="middle">Independent check</text>
<rect x="984" y="72" width="184" height="64" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/>
<text x="1076" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="middle">Main</text>
<circle r="8" cy="104" fill="#f0f6fc" opacity="0">
<animate attributeName="cx" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.24;0.40;1" keySplines="0.4 0 0.6 1;0 0 1 1;0 0 1 1" values="120;584;584;584"/>
<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.02;0.34;0.40;1" values="0;1;1;0;0"/>
</circle>
<g stroke="#f0f6fc" stroke-width="3.2" stroke-linecap="round" opacity="0">
<line x1="724" y1="28" x2="748" y2="52"/><line x1="748" y1="28" x2="724" y2="52"/>
<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.26;0.31;0.38;0.43;1" values="0;0;1;1;0;0"/>
</g>
<circle r="8" cy="104" fill="#f0f6fc" opacity="0">
