<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 162" width="1200" height="162" role="img" aria-label="A change travels from the agent, through the tests, to an independent check. A sabotaged change stops at the check. An honest change lands on main."><title>A change travels from the agent, through the tests, to an independent check. A sabotaged change stops at the check. An honest change lands on main.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker></defs>
<line x1="208" y1="104" x2="306" y2="104" stroke="#656c76" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="488" y1="104" x2="586" y2="104" stroke="#656c76" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="880" y1="104" x2="978" y2="104" stroke="#656c76" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="32" y="72" width="176" height="64" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/>
<text x="120" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="middle">Agent</text>
<rect x="312" y="72" width="176" height="64" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/>
