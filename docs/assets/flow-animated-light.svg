<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="A change travels from the agent, through the tests, to an independent check. A sabotaged change stops at the check. An honest change lands on main."><title>A change travels from the agent, through the tests, to an independent check. A sabotaged change stops at the check. An honest change lands on main.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<line x1="120" y1="100" x2="1072" y2="100" stroke="#8c959f" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="32" y="68" width="176" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="120" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Agent</text>
<rect x="312" y="68" width="176" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="400" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Tests</text>
<rect x="592" y="68" width="288" height="64" rx="12" fill="#eceff2" stroke="#1f2328" stroke-width="1.6"/>
<text x="736" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Independent check</text>
<rect x="984" y="68" width="184" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="1076" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Main</text>
<circle r="10" cy="100" fill="#1f2328">
<animate attributeName="cx" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.27;0.42;1" keySplines="0.4 0 0.6 1;0 0 1 1;0 0 1 1" values="120;700;700;700"/>
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.03;0.34;0.42;1" values="0;1;1;0;0"/>
</circle>
<g stroke="#1f2328" stroke-width="3.4" stroke-linecap="round" opacity="0">
<line x1="724" y1="28" x2="748" y2="52"/><line x1="748" y1="28" x2="724" y2="52"/>
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.29;0.34;0.44;0.50;1" values="0;0;1;1;0;0"/>
</g>
<circle r="10" cy="100" fill="#1f2328">
<animate attributeName="cx" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.52;0.80;1" keySplines="0 0 1 1;0.4 0 0.6 1;0 0 1 1" values="120;120;1076;1076"/>
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.52;0.57;0.93;1" values="0;0;1;1;0"/>
</circle>
<path d="M1058,40 L1072,54 L1094,26" fill="none" stroke="#1f2328" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity="0">
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.80;0.85;0.93;1" values="0;0;1;1;0"/>
</path>
